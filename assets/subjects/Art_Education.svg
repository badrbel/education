<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="paletteGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350f" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="paintRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="paintBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <radialGradient id="paintGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <radialGradient id="paintPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/><stop offset="100%" stop-color="#9333ea"/>
    </radialGradient>
    <radialGradient id="paintOrange" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <linearGradient id="brushHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Palette Body -->
  <path d="M 230 48 C 110 48 36 142 36 260 C 36 370 120 460 236 460 C 275 460 305 435 305 398 C 305 378 295 362 295 344 C 295 316 320 295 348 295 C 418 295 476 242 476 168 C 476 102 366 48 230 48 Z"
        fill="url(#paletteGrad)" filter="url(#clayShadow)"/>

  <!-- Thumb Hole -->
  <ellipse cx="370" cy="370" rx="30" ry="24" fill="#ffffff" opacity="0.95" filter="drop-shadow(inset 0 4px 6px rgba(0,0,0,0.3))"/>

  <!-- Paint Blobs -->
  <circle cx="120" cy="150" r="32" fill="url(#paintRed)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <circle cx="210" cy="115" r="34" fill="url(#paintBlue)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <circle cx="310" cy="120" r="32" fill="url(#paintGreen)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <circle cx="110" cy="250" r="30" fill="url(#paintPurple)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <circle cx="150" cy="350" r="32" fill="url(#paintOrange)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>

  <!-- Paintbrush across palette -->
  <g transform="rotate(-35 320 240)">
    <!-- Brush Handle -->
    <rect x="310" y="80" width="18" height="260" rx="8" fill="url(#brushHandle)" filter="url(#clayShadow)"/>
    <!-- Metal Ferrule -->
    <rect x="307" y="60" width="24" height="35" rx="4" fill="url(#ferrule)"/>
    <!-- Bristles -->
    <path d="M 307 60 C 307 35 319 15 319 15 C 319 15 331 35 331 60 Z" fill="url(#bristles)"/>
  </g>
</svg>
